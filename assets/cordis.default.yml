# Standalone defaults used by `npx @dumbo/dsh-acp` when the working directory has no
# cordis.yml. Deployment-specific configuration can replace this file through
# `--config` without changing the adapter.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  config:
    thinking: enabled
    reasoningEffort: max
    models:
      - id: deepseek-v4-flash
      - id: deepseek-v4-pro

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    persona: |
      You are a coding assistant powered by {{model}}. Your working directory is {{cwd}}.
      Verify changes with relevant checks. Keep answers brief and factual.
    workspaceContext:
      maxBytes: 65536
    skills:
      enabled: false
    toolBash: false
    toolJobs: false
    goals: false

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: rich-acp
  name: '../dist/index.js'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro
    reasoningEffort: max
